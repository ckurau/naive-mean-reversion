name: V49 Backtest

on:
  workflow_dispatch:
    inputs:
      run_walkforward:
        description: 'Run walk-forward validation (adds ~6-8 hours)'
        required: false
        default: 'false'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run V49 backtest
        run: python backtest-nmr-v49.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/v49/
          git diff --cached --quiet || git commit -m "V49 results [skip ci]"
          git push
