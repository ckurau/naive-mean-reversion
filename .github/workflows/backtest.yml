name: Naive MR Backtest

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Backtest start date (YYYY-MM-DD)"
        required: false
        default: "2004-01-01"
      end_date:
        description: "Backtest end date (YYYY-MM-DD, leave blank for today)"
        required: false
        default: ""
      initial_capital:
        description: "Starting capital in USD"
        required: false
        default: "100000"
      run_walkforward:
        description: "Also run walk-forward test? (true/false)"
        required: false
        default: "false"

  schedule:
    - cron: "0 0 * * 0"

jobs:
  backtest:
    name: Run Naive Mean-Reversion Backtest
    runs-on: ubuntu-latest
    timeout-minutes: 480
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply date / capital overrides
        run: |
          if [ -n "${{ github.event.inputs.start_date }}" ]; then
            sed -i "s/^START_DATE.*=.*/START_DATE = \"${{ github.event.inputs.start_date }}\"/" backtest-nmr.py
            sed -i "s/^START_DATE.*=.*/START_DATE = \"${{ github.event.inputs.start_date }}\"/" backtest_nmr_lib.py
          fi
          if [ -n "${{ github.event.inputs.end_date }}" ]; then
            sed -i "s/^END_DATE.*=.*/END_DATE = \"${{ github.event.inputs.end_date }}\"/" backtest-nmr.py
            sed -i "s/^END_DATE.*=.*/END_DATE = \"${{ github.event.inputs.end_date }}\"/" backtest_nmr_lib.py
          fi
          if [ -n "${{ github.event.inputs.initial_capital }}" ]; then
            sed -i "s/^INITIAL_CAPITAL.*=.*/INITIAL_CAPITAL = ${{ github.event.inputs.initial_capital }}.0/" backtest-nmr.py
            sed -i "s/^INITIAL_CAPITAL.*=.*/INITIAL_CAPITAL = ${{ github.event.inputs.initial_capital }}.0/" backtest_nmr_lib.py
          fi

      - name: Run backtest
        run: python backtest-nmr.py

      - name: Run walk-forward test
        if: github.event.inputs.run_walkforward == 'true'
        run: python walkforward.py

      - name: Upload results as workflow artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-results-${{ github.run_id }}
          path: results/
          retention-days: 90

      - name: Commit results to repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "chore: backtest results $(date -u +%Y-%m-%d)"
          git stash
          git pull --rebase origin main
          git stash pop
          git push
