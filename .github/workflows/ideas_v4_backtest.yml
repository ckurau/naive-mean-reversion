name: Ideas V4 Backtest (Signal Quality Ideas)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Backtest start date (YYYY-MM-DD)"
        required: false
        default: "2004-01-01"
      end_date:
        description: "Backtest end date (YYYY-MM-DD, leave blank for today)"
        required: false
        default: ""
      initial_capital:
        description: "Starting capital in USD"
        required: false
        default: "100000"
      overnight_boost:
        description: "Idea1: score multiplier for high-overnight stocks (default 0.70)"
        required: false
        default: ""
      salience_threshold:
        description: "Idea2: min sector underperformance to qualify (default 0.03)"
        required: false
        default: ""
      skew_weight:
        description: "Idea4: skewness component weight (default 1.5)"
        required: false
        default: ""
      turnover_weight:
        description: "Idea5: turnover component weight (default 1.5)"
        required: false
        default: ""
      corr_floor:
        description: "Idea6: min size scale when correlation spikes (default 0.50)"
        required: false
        default: ""
      tests_to_run:
        description: "Comma-separated test names to run (blank = all 24 tests)"
        required: false
        default: ""

jobs:
  backtest-ideas-v4:
    name: Run Ideas V4 Backtest
    runs-on: ubuntu-latest
    timeout-minutes: 720
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scipy

      - name: Apply parameter overrides
        run: |
          if [ -n "${{ github.event.inputs.start_date }}" ]; then
            sed -i "s/^START_DATE.*=.*/START_DATE = \"${{ github.event.inputs.start_date }}\"/" backtest_nmr_lib.py
          fi
          if [ -n "${{ github.event.inputs.end_date }}" ]; then
            sed -i "s/^END_DATE.*=.*/END_DATE = \"${{ github.event.inputs.end_date }}\"/" backtest_nmr_lib.py
          fi
          if [ -n "${{ github.event.inputs.initial_capital }}" ]; then
            sed -i "s/^INITIAL_CAPITAL.*=.*/INITIAL_CAPITAL = ${{ github.event.inputs.initial_capital }}.0/" backtest_nmr_lib.py
          fi
          if [ -n "${{ github.event.inputs.overnight_boost }}" ]; then
            sed -i "s/^OVERNIGHT_BOOST_MULT.*/OVERNIGHT_BOOST_MULT  = ${{ github.event.inputs.overnight_boost }}/" backtest_ideas_v4.py
          fi
          if [ -n "${{ github.event.inputs.salience_threshold }}" ]; then
            sed -i "s/^SALIENCE_THRESHOLD.*/SALIENCE_THRESHOLD    = ${{ github.event.inputs.salience_threshold }}/" backtest_ideas_v4.py
          fi
          if [ -n "${{ github.event.inputs.skew_weight }}" ]; then
            sed -i "s/^SKEW_WEIGHT.*/SKEW_WEIGHT           = ${{ github.event.inputs.skew_weight }}/" backtest_ideas_v4.py
          fi
          if [ -n "${{ github.event.inputs.turnover_weight }}" ]; then
            sed -i "s/^TURNOVER_WEIGHT.*/TURNOVER_WEIGHT       = ${{ github.event.inputs.turnover_weight }}/" backtest_ideas_v4.py
          fi
          if [ -n "${{ github.event.inputs.corr_floor }}" ]; then
            sed -i "s/^CORR_FLOOR.*/CORR_FLOOR            = ${{ github.event.inputs.corr_floor }}/" backtest_ideas_v4.py
          fi
          if [ -n "${{ github.event.inputs.tests_to_run }}" ]; then
            python3 - <<'PYEOF'
          import sys
          requested = [t.strip() for t in "${{ github.event.inputs.tests_to_run }}".split(",") if t.strip()]
          if not requested:
              sys.exit(0)
          keep = set(requested) | {"Baseline_V35", "Baseline_V35_I3"}
          filter_code = f"""
          TESTS = [t for t in TESTS if t["name"] in {sorted(keep)}]
          print(f"[Workflow] Running {{len(TESTS)}} tests: " + ", ".join(t['name'] for t in TESTS))
          """
          with open("backtest_ideas_v4.py", "r") as f:
              content = f.read()
          content = content.replace("if __name__ == \"__main__\":",
                                    filter_code + "\nif __name__ == \"__main__\":")
          with open("backtest_ideas_v4.py", "w") as f:
              f.write(content)
          print(f"Filtered to: {sorted(keep)}")
          PYEOF
          fi

      - name: Run Ideas V4 Backtest
        run: python backtest_ideas_v4.py

      - name: Upload results as workflow artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ideas-v4-results-${{ github.run_id }}
          path: results_ideas_v4/
          retention-days: 90

      - name: Commit results to repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results_ideas_v4/
          git diff --cached --quiet || git commit -m "chore: ideas-v4 results $(date -u +%Y-%m-%d) [run ${{ github.run_id }}]"
          git stash
          git pull --rebase origin main
          git stash pop
          git push

      - name: Print summary to job log
        if: always()
        run: |
          if [ -f results_ideas_v4/comparison.json ]; then
            python3 -c "
          import json
          with open('results_ideas_v4/comparison.json') as f:
              data = json.load(f)
          print(f'{'Test':<24} {'CAGR%':>7} {'MaxDD%':>8} {'Sharpe':>7} {'FinalEq':>13}')
          print('-'*65)
          for d in data:
              print(f'{d[\"test\"]:<24} {d[\"cagr\"]:>7.2f} {d[\"max_dd\"]:>8.2f} {d[\"sharpe\"]:>7.2f} {d[\"final_eq\"]:>13,.0f}')
          "
          fi
