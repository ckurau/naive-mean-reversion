name: Ideas V7.2 Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Ideas V7.2 backtest
        run: python backtest_ideas_v7_2.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results_ideas_v7_2/
          git diff --cached --quiet || git commit -m "chore: ideas-v7.2 results $(date -u +%Y-%m-%d) [run ${{ github.run_id }}]"
          git push
